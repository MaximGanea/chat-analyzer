services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_analyzer
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: prod
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # TODO (prod): add healthcheck, resource limits, secrets, etc.

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    # TODO (prod): configure SSL termination (certbot / ALB), CDN offload, etc.

volumes:
  pg_data_prod:
