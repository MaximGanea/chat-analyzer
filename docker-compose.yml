services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: temple_project
      POSTGRES_USER: temple_user
      POSTGRES_PASSWORD: temple_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temple_user -d temple_project"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # hot-reload: mount source files
    env_file:
      - ./backend/.env
    environment:
      - RUN_MIGRATIONS=1        # dev only: prod runs migrations as a separate CD job
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app         # hot-reload (HMR)
      - /app/node_modules       # keep container node_modules, don't override with host
    env_file:
      - ./frontend/.env
    environment:
      - API_URL=http://backend:8000   # used in vite.config.js proxy
    depends_on:
      - backend

volumes:
  pg_data:
